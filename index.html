 Tributário Nacional. A contagem e os valores dependem da análise dos pagamentos e das particularidades do caso."}},{"@type":"Question","name":"Preciso parar de pagar o IPTU?","acceptedAnswer":{"@type":"Answer","text":"Não deixe de pagar por conta própria. A falta de pagamento pode gerar encargos e cobrança. A forma de questionar o imposto e qualquer medida sobre sua exigibilidade devem ser avaliadas individualmente pelo advogado."}},{"@type":"Question","name":"Quais documentos preciso apresentar?","acceptedAnswer":{"@type":"Answer","text":"Para a análise inicial, tenha o carnê de IPTU. Se disponíveis, também ajudam a matrícula, o habite-se, o contrato de compra e venda e os comprovantes de pagamento anteriores. O envio é orientado pelo advogado durante o atendimento."}},{"@type":"Question","name":"Quanto tempo demora e como funciona a contratação?","acceptedAnswer":{"@type":"Answer","text":"O prazo varia conforme a complexidade e o caminho administrativo ou judicial. O escopo, os honorários e as condições são apresentados antes da contratação. Na conversa inicial, você recebe orientação sobre os próximos passos."}},{"@type":"Question","name":"Preciso ir ao escritório?","acceptedAnswer":{"@type":"Answer","text":"Você pode iniciar o atendimento pelo WhatsApp e receber orientação para apresentar os documentos à distância. As necessidades das próximas etapas são combinadas conforme o caso."}},{"@type":"Question","name":"Existe garantia de redução ou restituição?","acceptedAnswer":{"@type":"Answer","text":"Não há garantia de resultado. Cada caso depende dos documentos, da legislação aplicável e da avaliação das autoridades competentes. O compromisso é com análise técnica, informação clara e atuação responsável."}}]}]}</script>
